parameters:
  - name: Environment
    displayName: Test environment
    type: string
    default: dev
    values:
      - dev
      - stg
      - uat
      - prod

trigger:
  branches:
    include:
      - main

# Azure Repos requires a Build Validation branch policy for pull requests.
pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 * * * *'
    displayName: Hourly test run (UTC)
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Lint
    displayName: Lint
    jobs:
      - job: Lint
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: npm ci && npm run lint
            displayName: Install dependencies and lint

  - stage: ApiTests
    displayName: Backend API tests
    dependsOn: Lint
    jobs:
      - job: RunTests
        displayName: Run API tests
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: npm ci
            displayName: Install dependencies

          # Set these in pipeline variables or link a variable group.
          - bash: |
              case "$TARGET_ENV" in
                dev) base_url="$BASE_URL_DEV"; variable_name="BASE_URL_DEV" ;;
                stg) base_url="$BASE_URL_STG"; variable_name="BASE_URL_STG" ;;
                uat) base_url="$BASE_URL_UAT"; variable_name="BASE_URL_UAT" ;;
                prod) base_url="$BASE_URL_PROD"; variable_name="BASE_URL_PROD" ;;
                *) echo "Unsupported environment: $TARGET_ENV"; exit 1 ;;
              esac

              if [[ -z "$base_url" || "$base_url" == '$('* ]]; then
                echo "Set $variable_name in pipeline variables."
                exit 1
              fi

              BASE_URL="$base_url" npm run test:ci -- --reporter=list,allure-playwright,json
            displayName: Run API tests
            env:
              TARGET_ENV: ${{ parameters.environment }}
              BASE_URL_DEV: $(BASE_URL_DEV)
              BASE_URL_STG: $(BASE_URL_STG)
              BASE_URL_UAT: $(BASE_URL_UAT)
              BASE_URL_PROD: $(BASE_URL_PROD)
              DUMMYJSON_USERNAME: $(DUMMYJSON_USERNAME)
              DUMMYJSON_PASSWORD: $(DUMMYJSON_PASSWORD)
              CI: 'true'
              PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright-report.json

          - bash: |
              if find allure-results -type f -print -quit 2>/dev/null | grep -q .; then
                npx allure generate allure-results --clean --output allure-report || exit $?
                echo "##vso[task.setvariable variable=allureReportGenerated]true"
              else
                echo "No tests ran; skipping Allure report generation."
              fi
            displayName: Generate Allure report
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: Publish Allure report
            condition: and(always(), eq(variables['allureReportGenerated'], 'true'))
            inputs:
              targetPath: allure-report
              artifactName: allure-report
              publishLocation: pipeline

          - bash: |
              node scripts/summarize-playwright-results.js test-results/playwright-report.json test-summary.md
              echo "##vso[task.uploadsummary]$(Build.SourcesDirectory)/test-summary.md"
            displayName: Summarize test results
            condition: always()
            env:
              TARGET_ENV: ${{ parameters.environment }}
